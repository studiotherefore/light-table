# Publishes the demo board as a read-only website on GitHub Pages.
# Rebuilt daily too: demo mode shifts the dates at build time, so the newest project keeps reading "today".
name: Demo site

on:
  push:
    branches: [main]
    paths: ["core/**", "demo/**", ".github/workflows/demo-site.yml"]
  pull_request:
    paths: ["core/**", "demo/**", ".github/workflows/demo-site.yml"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Pull requests only build (to check the export); main publishes, one deploy at a time.
  group: ${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    # macOS: build.py makes the thumbnails with sips.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 demo/export-site.py _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
